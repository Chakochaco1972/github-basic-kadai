<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" contrnt="My portfolioサイトの模写コーディング">
    <title>MyProfile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">   
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <div id="header-inner">
            <h1><a href="index.html">MyProfile</a></h1>

        <!-- ナビ -->
        <nav>
            <ul id="nav">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#works">Works</a></li>
            </ul>
        </nav>
        </div>
    </header>

    <!-- メイン -->
    <main>
        <article>
            <div>
                <img src="images/main.png" alt="CanonのCamera">
            </div>

        <!-- About -->
            <section id="about" class="clear">
                <h2>About</h2>
                <div class="photo01">
                    <img src="images/about.png" alt="Kazuki Asahina">
                </div>   
                <div class="content">
                    <p id="name">Kazuki Asahina</p>
                    <ul>
                        <li>25歳 長野県佐久市出身</li>
                        <li>ソフトウェア業界でマーケティングに従事</li>
                        <li>趣味はカメラ、愛機はCanon</li>
                        <li>自然を撮影するのが好きで、海や山によく行く</li>
                    </ul>
                </div>
            </section>

            <!-- Works -->
            <section id="works">
                <h2>Works</h2>
                <div class="works">
                    <figure class="works_photo">
                    <img src="images/works1.png" alt="works01">
                    <figcaption>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚</figcaption>  
                    </figure>
                    <figure class="works_photo">
                    <img src="images/works2.png" alt="works02">
                    <figcaption>地元長野の木曽町から撮影した、冠雪した御嶽山</figcaption>  
                    </figure>
                    <figure class="works_photo">
                    <img src="images/works3.png" alt="works03">
                    <figcaption>京都で撮影した、明け方の古き良き日本の町並み</figcaption>  
                    </figure>                                
                </div>
            </section>
    </article>
   </main>

    <!-- footer -->
    <footer>
        <p id="copyright">&copy;MyProfile. All Rights Reserved.</p>
    </footer>
    
</body>
</html>
